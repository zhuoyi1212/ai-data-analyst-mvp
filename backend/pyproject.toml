[project]
name = "ai-data-analyst-backend"
version = "0.1.0"
description = "AI Data Analyst MVP - FastAPI backend with deterministic analysis engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
